let index = 0;
let spokenResult = "";

const recognition =
new (window.SpeechRecognition || window.webkitSpeechRecognition)();

recognition.lang = "en-US";

function normalize(text){
return text
.toLowerCase()
.trim()
.replace(/\n/g," ")
.replace(/\s+/g," ")
.replace(/[.,]/g,"");
}

function speak(text){
const u = new SpeechSynthesisUtterance(text);
u.lang = "en-US";
speechSynthesis.speak(u);
}

function loadActivity(){

const a = activities[index];

document.getElementById("question").innerText =
`📝 ${a.question}`;

document.getElementById("prompt").innerText =
a.prompt || "";

document.getElementById("feedback").innerText = "";

document.getElementById("nextBtn").disabled = true;

const area = document.getElementById("input-area");

area.innerHTML = "";

if(a.audio){

const btn = document.createElement("button");

btn.innerText = "🔊 Ouvir áudio";

btn.onclick = ()=> speak(a.audio);

area.appendChild(btn);

}

if(a.type === "input"){

const input = document.createElement("input");

input.oninput = ()=> checkAnswer(input.value);

area.appendChild(input);

}

if(a.type === "textarea"){

const ta = document.createElement("textarea");

ta.oninput = ()=> checkAnswer(ta.value);

area.appendChild(ta);

}

if(a.type === "choice"){

const div = document.createElement("div");

div.className = "options";

a.options.forEach(opt=>{

const btn = document.createElement("button");

btn.innerText = opt;

btn.className = "secondary";

btn.onclick = ()=> checkAnswer(opt);

div.appendChild(btn);

});

area.appendChild(div);

}

if(a.type === "speech"){

const btn = document.createElement("button");

btn.innerText = "🎙️ Gravar fala";

btn.onclick = ()=>{

recognition.start();

recognition.onresult = e=>{

spokenResult =
normalize(e.results[0][0].transcript);

checkAnswer(spokenResult);

};

};

area.appendChild(btn);

}

document.getElementById("progress").innerText =
`Atividade ${index+1} de ${activities.length}`;

}

function checkAnswer(answer){

const a = activities[index];

let correct = false;

if(a.type === "input"){

correct =
a.answers.includes(normalize(answer));

}

else if(a.type === "textarea"){

const normalized = normalize(answer);

correct =
a.answers.some(ans =>
normalized.includes(normalize(ans))
);

}

else if(a.type === "speech"){

correct =
a.answers.map(normalize).includes(answer);

}

else{

correct = answer === a.answer;

}

const fb = document.getElementById("feedback");

if(correct){

fb.innerText =
"✅ Muito bem! Pode avançar.";

fb.className = "feedback success";

document.getElementById("nextBtn").disabled = false;

}else{

fb.innerText =
"❌ Revise os conteúdos e tente novamente.";

fb.className = "feedback error";

}

}

function nextActivity(){

index++;

if(index < activities.length){

loadActivity();

}else{

document.querySelector(".card").innerHTML = `

<h1>🎉 Aula 8 concluída!</h1>

Voltar ao módulo
</button>

`;

}

}
