<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aula 7 – Atividades | English + Tech</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0f1220;
  --card:#1b1f3b;
  --accent:#4a6cf7;
  --text:#eaeaf0;
  --muted:#aab0d6;
  --success:#4caf50;
  --error:#ff5c5c;
}

body{
  margin:0;
  padding:20px 20px 90px;
  font-family:Segoe UI, Arial, sans-serif;
  background:linear-gradient(135deg,#0f1220,#14183a);
  color:var(--text);
}

.card{
  background:var(--card);
  padding:24px;
  border-radius:16px;
  max-width:720px;
  margin:40px auto;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

button{
  background:var(--accent);
  border:none;
  border-radius:8px;
  padding:12px 18px;
  color:white;
  cursor:pointer;
  font-size:15px;
  margin-top:14px;
}

button.secondary{
  background:#242862;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.options button{
  display:block;
  width:100%;
  margin:10px 0;
}

input, textarea{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  margin-top:10px;
  font-size:15px;
}

textarea{
  min-height:140px;
  resize:vertical;
}

.feedback{
  margin-top:16px;
  font-weight:bold;
}

.success{color:var(--success);}
.error{color:var(--error);}

.progress{
  text-align:center;
  margin-top:20px;
  color:var(--muted);
}

footer{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#0b0e1a;
  text-align:center;
  font-size:.85rem;
  padding:10px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="card">

<nav>
  <button onclick="window.location.href='aula7.html'">Aula</button>
  <button onclick="window.location.href='mod1.html'">Módulo 1</button>
</nav>

<h1>🚀 Aula 7 – Atividades</h1>
<p>Foque em <strong>a / an / the + contexto</strong> 🧠</p>

<h2 id="question"></h2>
<p id="prompt"></p>

<div id="input-area"></div>

<p id="feedback" class="feedback"></p>

<button id="nextBtn" onclick="nextActivity()" disabled>Avançar ➡️</button>

<div class="progress" id="progress"></div>

</div>

<footer>© Curso PSIDE – Inglês + Tecnologia</footer>

<script>
const activities = [

/* ===== 1–10 ARTICLES ===== */
{question:"Complete:",prompt:"I have ( ___ computer ).",type:"input",answers:["a computer"]},
{question:"Complete:",prompt:"I see ( ___ error ).",type:"input",answers:["an error"]},
{question:"Complete:",prompt:"( ___ computer ) is fast. (já conhecido)",type:"input",answers:["the computer"]},
{question:"Choose:",type:"choice",options:["a apple","an apple"],answer:"an apple"},
{question:"Choose:",type:"choice",options:["a error","an error"],answer:"an error"},
{question:"Choose:",type:"choice",options:["a computer","an computer"],answer:"a computer"},
{question:"Translate:",prompt:"I have a computer",type:"choice",options:["Eu tenho um computador","Eu tenho computador","Aquilo é computador"],answer:"Eu tenho um computador"},
{question:"Translate:",prompt:"The computer is fast",type:"choice",options:["Um computador é rápido","O computador é rápido","Computador rápido"],answer:"O computador é rápido"},
{question:"Complete:",prompt:"I open ( ___ project ) (primeira vez)",type:"input",answers:["a project"]},
{question:"Complete:",prompt:"( ___ project ) is working (já conhecido)",type:"input",answers:["the project"]},

/* ===== 11–20 CONTEXT ===== */
{question:"Choose:",type:"choice",options:["I have a laptop","I have the laptop (primeira vez)"],answer:"I have a laptop"},
{question:"Choose:",type:"choice",options:["The laptop is new","A laptop is new (específico)"],answer:"The laptop is new"},
{question:"Complete:",prompt:"I write ( ___ code )",type:"input",answers:["a code"]},
{question:"Complete:",prompt:"( ___ code ) is working",type:"input",answers:["the code"]},
{question:"Choose:",type:"choice",options:["I fix an error","I fix a error"],answer:"I fix an error"},
{question:"Choose:",type:"choice",options:["A error is fixed","The error is fixed"],answer:"The error is fixed"},
{question:"Translate:",prompt:"I test a program",type:"choice",options:["Eu testo programa","Aquilo é programa","Eu testo um programa"],answer:"Eu testo um programa"},
{question:"Translate:",prompt:"The program works",type:"choice",options:["O programa funciona","Um programa funciona","Programa funciona"],answer:"O programa funciona"},
{question:"Complete:",prompt:"I create ( ___ repository )",type:"input",answers:["a repository"]},
{question:"Complete:",prompt:"( ___ repository ) is online",type:"input",answers:["the repository"]},

/* ===== 21–30 STRUCTURE ===== */
{question:"Choose:",type:"choice",options:["I have a project","I have project a"],answer:"I have a project"},
{question:"Choose:",type:"choice",options:["The project is ready","Project the is ready"],answer:"The project is ready"},
{question:"Complete:",prompt:"I add ( ___ feature )",type:"input",answers:["a feature"]},
{question:"Complete:",prompt:"( ___ feature) works",type:"input",answers:["the feature"]},
{question:"Choose:",type:"choice",options:["I see a input","I see an input"],answer:"I see an input"},
{question:"Choose:",type:"choice",options:["Input the is correct","The input is correct"],answer:"The input is correct"},
{question:"Translate:",prompt:"I create a version",type:"choice",options:["Eu crio versão","Eu crio uma versão","Aquilo é versão"],answer:"Eu crio uma versão"},
{question:"Translate:",prompt:"The version is updated",type:"choice",options:["Uma versão está atualizada","Versão atualizada","A versão está atualizada"],answer:"A versão está atualizada"},
{question:"Complete:",prompt:"I run ( ___ test )",type:"input",answers:["a test"]},
{question:"Complete:",prompt:"( ___ test ) is successful",type:"input",answers:["the test"]},

/* ===== 31–33 LISTENING ===== */
{
question:"Listening – Ouça:",
audio:"I have a computer.",
type:"choice",
options:[
"I have the computer.",
"I have a computer.",
"I computer have a."
],
answer:"I have a computer."
},
{
question:"Listening – Ouça:",
audio:"The program works.",
type:"choice",
options:[
"A program works.",
"Program the works.",
"The program works."
],
answer:"The program works."
},

/* ===== 34–36 SPEAKING ===== */
{
question:"Speaking – Say:",
prompt:"I have a computer.",
type:"speech",
answers:["i have a computer"]
},
{
question:"Speaking – Say:",
prompt:"I fix an error.",
type:"speech",
answers:["i fix an error"]
},

/* ===== 37–40 WRITING ===== */
{
question:"Escreva em inglês:",
prompt:"Eu tenho um projeto.",
type:"input",
answers:["i have a project"]
},
{
question:"Escreva em inglês:",
prompt:"O projeto está pronto.",
type:"input",
answers:["the project is ready"]
},
{
question:"Corrija:",
prompt:"I have an computer",
type:"input",
answers:["i have a computer"]
},
{
question:"Corrija:",
prompt:"I see a error",
type:"input",
answers:["i see an error"]
},

/* ===== 41–43 MISSION ===== */
{
question:"Missão – Escreva:",
prompt:"Escreva 4 frases (use a, an e the): Eu tenho um computador. Eu vejo um erro. O computador é rápido. O erro foi corrigido.",
type:"textarea",
answers:[
"i have a computer i see an error the computer is fast the error is fixed"
]
},
{
question:"Missão – Speaking:",
prompt:"I have a computer and the computer is fast.",
type:"speech",
answers:["i have a computer and the computer is fast"]
},
{
question:"Final:",
prompt:"Choose the correct:",
type:"choice",
options:[
"I see a apple",
"I apple see an",
"I see an apple"
],
answer:"I see an apple"
}

];

let index = 0;
let spokenResult = "";

const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = "en-US";

function normalize(text){
  return text.toLowerCase().trim().replace(/\n/g," ").replace(/\s+/g," ").replace(/[.,]/g,"");
}

function speak(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  speechSynthesis.speak(u);
}

function loadActivity(){
  const a = activities[index];
  document.getElementById("question").innerText = `📝 ${a.question}`;
  document.getElementById("prompt").innerText = a.prompt || "";
  document.getElementById("feedback").innerText = "";
  document.getElementById("nextBtn").disabled = true;

  const area = document.getElementById("input-area");
  area.innerHTML = "";

  if(a.audio){
    const btn = document.createElement("button");
    btn.innerText = "🔊 Ouvir áudio";
    btn.onclick = ()=> speak(a.audio);
    area.appendChild(btn);
  }

  if(a.type === "input"){
    const input = document.createElement("input");
    input.oninput = ()=> checkAnswer(input.value);
    area.appendChild(input);
  }

  if(a.type === "textarea"){
    const ta = document.createElement("textarea");
    ta.oninput = ()=> checkAnswer(ta.value);
    area.appendChild(ta);
  }

  if(a.type === "choice"){
    const div = document.createElement("div");
    div.className = "options";
    a.options.forEach(opt=>{
      const btn = document.createElement("button");
      btn.innerText = opt;
      btn.className = "secondary";
      btn.onclick = ()=> checkAnswer(opt);
      div.appendChild(btn);
    });
    area.appendChild(div);
  }

  if(a.type === "speech"){
    const btn = document.createElement("button");
    btn.innerText = "🎙️ Gravar fala";
    btn.onclick = ()=>{
      recognition.start();
      recognition.onresult = e=>{
        spokenResult = normalize(e.results[0][0].transcript);
        checkAnswer(spokenResult);
      };
    };
    area.appendChild(btn);
  }

  document.getElementById("progress").innerText =
    `Atividade ${index+1} de ${activities.length}`;
}

function checkAnswer(answer){
  const a = activities[index];
  let correct = false;

  if(a.type === "input" || a.type === "textarea"){
    correct = a.answers.includes(normalize(answer));
  }else if(a.type === "speech"){
    correct = a.answers.map(normalize).includes(answer);
  }else{
    correct = answer === a.answer;
  }

  const fb = document.getElementById("feedback");

  if(correct){
    fb.innerText = "✅ Muito bem! Pode avançar.";
    fb.className = "feedback success";
    document.getElementById("nextBtn").disabled = false;
  }else{
    fb.innerText = "❌ Revise o uso de a / an / the.";
    fb.className = "feedback error";
  }
}

function nextActivity(){
  index++;
  if(index < activities.length){
    loadActivity();
  }else{
    document.querySelector(".card").innerHTML = `
      <h1>🎉 Aula 7 concluída!</h1>
      <p>Agora você domina <strong>a / an / the</strong> 🔥</p>
      <button onclick="window.location.href='mod1.html'">Voltar ao módulo</button>
    `;
  }
}

loadActivity();
</script>

</body>
</html>
